[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinpoint"
version = "0.1.0"
description = "Version-correct LLM code via runtime introspection of the installed package"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
keywords = ["llm", "code-generation", "introspection", "version"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/pinpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pinpoint = "pinpoint.cli:main"
